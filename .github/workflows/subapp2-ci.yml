name: Subapp 2 - build and lint

on:
  push:
    branches: [exam-readiness-audit-fixes, Salman-branch, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build API (Release)
        run: dotnet build api/api.csproj --configuration Release
      - name: Install SPA dependencies (locked)
        working-directory: client
        run: npm ci
      - name: Build SPA
        working-directory: client
        run: npm run build
      - name: Check SPA lint
        working-directory: client
        run: npm run lint
