name: Subapp 2 - build and startup smoke checks

on:
  push:
    branches: [exam-readiness-audit-fixes, Salman-branch, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build API (Release)
        run: dotnet build api/api.csproj --configuration Release
      - name: Install SPA dependencies (locked)
        working-directory: client
        run: npm ci
      - name: Build SPA
        working-directory: client
        run: npm run build
      - name: Check SPA lint
        working-directory: client
        run: npm run lint
      - name: Run API and test public endpoint
        shell: bash
        run: |
          set -euo pipefail
          export Jwt__Key="$(openssl rand -base64 32)"
          dotnet run --project api/api.csproj --no-build --configuration Release --launch-profile http > /tmp/spa-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat /tmp/spa-api.log' EXIT
          curl --fail --silent --show-error --retry 25 --retry-delay 2 --retry-connrefused 'http://localhost:5116/api/challenges?filter=All' -o /tmp/challenges.json
          python3 -c 'import json; x=json.load(open("/tmp/challenges.json")); assert isinstance(x, list), "Expected a list of challenges"'
          python3 scripts/smoke_api.py
      - name: Check Vite proxy to API
        shell: bash
        run: |
          set -euo pipefail
          export Jwt__Key="$(openssl rand -base64 32)"
          dotnet run --project api/api.csproj --no-build --configuration Release --launch-profile http > /tmp/spa-api-proxy.log 2>&1 &
          api_pid=$!
          (cd client && npm run dev -- --host 127.0.0.1 > /tmp/spa-vite.log 2>&1) &
          vite_pid=$!
          trap 'kill "$api_pid" "$vite_pid" 2>/dev/null || true; cat /tmp/spa-api-proxy.log; cat /tmp/spa-vite.log' EXIT
          curl --fail --silent --show-error --retry 25 --retry-delay 2 --retry-connrefused 'http://127.0.0.1:5173/api/challenges?filter=All' -o /tmp/proxied-challenges.json
          python3 -c 'import json; x=json.load(open("/tmp/proxied-challenges.json")); assert isinstance(x, list), "Expected a proxied list of challenges"'
